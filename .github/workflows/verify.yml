name: Verify skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install 'shellcheck-py==0.11.0.1' 'PyYAML==6.0.3'
      - name: Run offline checks (scripts, mock codex, links, frontmatter, ShellCheck)
        run: python tests/verify.py
